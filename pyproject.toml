[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-biobank-agent"
version = "0.1.0"
description = "Codex-orchestrated, aggregate-only analysis across biobank sites"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
nvflare = ["nvflare~=2.9.0rc"]
test = ["pytest>=8"]

[project.scripts]
biobank-agent = "biobank_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biobank_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
